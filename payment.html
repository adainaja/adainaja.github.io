<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Pembayaran - AdaAja</title>
  <link rel="stylesheet" href="payment.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <button class="icon-button" type="button" onclick="history.back()" aria-label="Kembali">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <div class="page-title">
      <span>PEMBAYARAN AMAN</span>
      <h1>Bayar Pesanan</h1>
    </div>

    <div class="secure-icon" aria-label="Pembayaran terlindungi">
      <svg viewBox="0 0 24 24">
        <path d="M12 3 5 6v5c0 4.7 3 8.3 7 10 4-1.7 7-5.3 7-10V6l-7-3Z"></path>
        <path d="m9.5 12 1.7 1.7 3.8-4"></path>
      </svg>
    </div>
  </header>

  <main id="paymentContent">
    <section class="loading-state">
      <div class="loading-card hero-loading"></div>
      <div class="loading-card"></div>
      <div class="loading-card small"></div>
    </section>
  </main>

  <section class="error-state hidden" id="errorState">
    <div class="error-icon">!</div>
    <strong>Pembayaran tidak dapat dibuka</strong>
    <span id="errorMessage">Silakan coba kembali.</span>
    <button id="retryButton" type="button">Coba Lagi</button>
    <a href="my-orders.html">Kembali ke Pesanan Saya</a>
  </section>

</div>

<div class="bottom-bar hidden" id="bottomBar">
  <div class="total-box">
    <span>Total pembayaran</span>
    <strong id="bottomTotal">Rp0</strong>
  </div>

  <button id="payButton" type="button">
    Bayar Sekarang
  </button>
</div>

<div class="result-modal" id="resultModal" aria-hidden="true">
  <div class="modal-backdrop"></div>

  <div class="result-sheet">
    <div class="result-icon" id="resultIcon">
      <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg>
    </div>

    <h2 id="resultTitle">Pembayaran diproses</h2>
    <p id="resultText">Status pembayaran sedang diperiksa.</p>

    <button id="resultPrimaryButton" type="button">
      Lihat Pesanan Saya
    </button>

    <button id="resultSecondaryButton" class="secondary-modal-button" type="button">
      Tutup
    </button>
  </div>
</div>

<script src="payment.js"></script>
</body>
</html>
