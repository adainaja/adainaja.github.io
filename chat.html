<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Chat — AdaAja</title>
  <link rel="stylesheet" href="chat.css?v=20260808-1">
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <button class="back-button" type="button" onclick="history.back()" aria-label="Kembali">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
      </button>

      <div class="chat-identity">
        <div class="chat-avatar" id="chatAvatar">A</div>
        <div>
          <strong id="chatName">Percakapan</strong>
          <span id="chatContext">AdaAja</span>
        </div>
      </div>

      <a class="context-button" id="contextButton" href="activity.html" aria-label="Lihat konteks">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      </a>
    </header>

    <section class="context-strip" id="contextStrip">
      <span class="context-label">KONTEKS</span>
      <strong id="contextTitle">Percakapan AdaAja</strong>
    </section>

    <main class="messages-area" id="messagesArea">
      <div class="chat-loading"><span></span><span></span><span></span></div>
    </main>

    <form class="composer" id="composer">
      <button class="composer-icon" type="button" id="attachmentButton" aria-label="Lampiran">
        <svg viewBox="0 0 24 24"><path d="M21 12.5 12.5 21a6 6 0 0 1-8.5-8.5L14 2.5a4 4 0 0 1 5.7 5.7L9.4 18.5a2 2 0 0 1-2.8-2.8L16 6.3"></path></svg>
      </button>

      <label class="input-shell">
        <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Tulis pesan..."></textarea>
      </label>

      <button class="send-button" id="sendButton" type="submit" aria-label="Kirim">
        <svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
      </button>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260807-1"></script>
  <script src="auth-session.js?v=20260807-3"></script>
  <script src="chat.js?v=20260808-1"></script>
</body>
</html>
