<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071e38">
  <title>Memverifikasi Akun — AdaAja</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#071e38;font-family:Arial,sans-serif}
    .card{width:min(100%,390px);padding:34px 24px;border-radius:26px;background:#fff;box-shadow:0 20px 55px rgba(7,30,56,.12);text-align:center}
    .spinner{width:48px;height:48px;margin:0 auto 20px;border:4px solid #e7edf4;border-top-color:#ff7a00;border-radius:50%;animation:spin .8s linear infinite}
    h1{margin:0;font-size:22px}
    p{margin:10px 0 0;color:#6f7f93;font-size:13px;line-height:1.6}
    a{display:none;margin-top:20px;padding:12px 16px;border-radius:13px;background:#071e38;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
    .error .spinner{display:none}
    .error a{display:inline-flex}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card" id="callbackCard">
    <div class="spinner"></div>
    <h1 id="callbackTitle">Memverifikasi akun</h1>
    <p id="callbackMessage">Mohon tunggu. Kami sedang menyiapkan sesi AdaAja Anda.</p>
    <a href="login.html" id="loginLink">Kembali ke halaman login</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260807-1"></script>
  <script src="auth-session.js?v=20260807-1"></script>
  <script src="auth-callback.js?v=20260807-1"></script>
</body>
</html>
