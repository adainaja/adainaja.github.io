<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar AdaAja</title>
<link rel="stylesheet" href="register.css">
</head>
<body>
<div class="app">

<header>
<a class="back" href="home.html">←</a>
<img src="assets/logo-adaaja.png" class="logo" alt="AdaAja">
</header>

<div class="steps">
<div class="active"></div><div></div><div></div>
</div>
<div class="labels">
<span>Akun</span><span>Profil</span><span>Selesai</span>
</div>

<section class="welcome">
<h1>Selamat datang di AdaAja 👋</h1>
<p>Buat akun dan mulai belanja atau jual barang dengan mudah.</p>
</section>

<form>

<label>Nama lengkap</label>
<input id="name" placeholder="Masukkan nama lengkap">

<label>Email atau nomor HP</label>
<input id="contact" placeholder="Masukkan email atau nomor HP">

<label>Password</label>
<div class="pass">
<input id="password" type="password" placeholder="Minimal 8 karakter">
<button type="button" onclick="toggle('password')">◉</button>
</div>

<label>Konfirmasi password</label>
<div class="pass">
<input id="confirm" type="password" placeholder="Ulangi password">
<button type="button" onclick="toggle('confirm')">◉</button>
</div>

<p id="message"></p>

<label class="check">
<input type="checkbox" id="agree">
<span>Saya setuju dengan syarat dan ketentuan AdaAja</span>
</label>

<button class="main-btn" type="button" onclick="register()">Buat Akun AdaAja</button>

<div class="divider"><span>atau</span></div>

<button class="google" type="button">
<svg width="18" height="18" viewBox="0 0 24 24">
<path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.2-2.09H12v3.95h5.24a4.48 4.48 0 0 1-1.94 2.93v2.45h3.15c1.84-1.7 2.9-4.2 2.9-7.24z"/>
<path fill="#34A853" d="M12 22c2.62 0 4.82-.87 6.43-2.36l-3.15-2.45c-.87.58-1.98.92-3.28.92-2.52 0-4.66-1.7-5.42-3.99H3.32v2.53A10 10 0 0 0 12 22z"/>
<path fill="#FBBC05" d="M6.58 14.12A6 6 0 0 1 6.27 12c0-.74.13-1.46.31-2.12V7.35H3.32A10 10 0 0 0 2 12c0 1.61.39 3.14 1.32 4.65l3.26-2.53z"/>
<path fill="#EA4335" d="M12 5.89c1.42 0 2.69.49 3.69 1.45l2.77-2.77C16.81 2.95 14.62 2 12 2A10 10 0 0 0 3.32 7.35l3.26 2.53C7.34 7.59 9.48 5.89 12 5.89z"/>
</svg>
Lanjutkan dengan Google
</button>

<p class="login">Sudah punya akun? <a href="login.html">Masuk</a></p>

</form>
</div>

<script src="register.js"></script>
</body>
</html>
